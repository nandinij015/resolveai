<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ResolveAI</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--bd:#2a3550;--tx:#e6eaf5;--mu:#8e9ab8;--ok:#3ecf8e;--warn:#f5a524;--bad:#f0616d;--blue:#5b9dff;--vio:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
header{padding:16px 24px;border-bottom:1px solid var(--bd);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}h1 span{color:var(--blue)}.mu{color:var(--mu)}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px}@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
button,select{background:#222c44;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;cursor:pointer;font:inherit}
button.primary{background:var(--blue);color:#06101f;border:0;font-weight:600;width:100%;margin-top:8px}
textarea{width:100%;height:340px;background:#0c111b;color:#c9d3ea;border:1px solid var(--bd);border-radius:6px;font:12px/1.4 ui-monospace,monospace;padding:8px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.rec{font-size:16px;padding:6px 14px}.approve_for_review{background:#12392b;color:var(--ok)}.request_more_evidence{background:#3a2c0d;color:var(--warn)}.flag_inconsistencies{background:#3d1a20;color:var(--bad)}
.verified_discrepancy{background:#3d1a20;color:var(--bad)}.policy_issue{background:#3a2c0d;color:var(--warn)}.missing_evidence{background:#14284a;color:var(--blue)}.suspected_risk_signal{background:#2a2147;color:var(--vio)}
.f{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}.f.sel{border-color:var(--blue);background:#1b2540}
.ev{margin:6px 0;padding:6px 8px;border-left:3px solid var(--bd);background:#0c111b;border-radius:4px;font-size:12px}
.ev code{color:#9fc1ff}svg{width:100%;background:#0c111b;border-radius:8px;border:1px solid var(--bd)}
svg text{fill:var(--tx);font-size:11px}.e{stroke:#3a4666;fill:none}.e.hi{stroke:var(--blue);stroke-width:2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}.m{background:#0c111b;border-radius:8px;padding:8px}.m b{font-size:18px;display:block}
</style></head><body>
<header><h1>Resolve<span>AI</span></h1><span class="mu">Evidence-linked claim investigation · decision support for a human reviewer · never auto-rejects</span>
<span style="margin-left:auto"><select id="mode"><option value="deterministic">Deterministic tools</option><option value="adk">Google ADK + Gemini</option></select></span></header>
<main>
<section class="card"><b>Claim</b><div style="margin:8px 0"><select id="sample" style="width:100%"></select></div>
<textarea id="claim" spellcheck="false"></textarea><button class="primary" id="go">Investigate claim</button><div id="err" style="color:var(--bad);margin-top:6px"></div></section>
<section><div class="card" id="out"><span class="mu">Pick a sample claim and run the investigation.</span></div>
<div class="card" style="margin-top:16px"><b>Offline evaluation</b> <span class="mu">(synthetic claims, known outcomes)</span><div class="grid" id="ev"></div></div></section>
</main>
<script>
let S=[],A=null,sel=null;const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label=k=>k.replace(/_/g," ");
fetch("/api/samples").then(r=>r.json()).then(d=>{S=d;$("sample").innerHTML=d.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join("");load()});
$("sample").onchange=load;function load(){const s=S[$("sample").value];$("claim").value=JSON.stringify(s.claim,null,2)}
fetch("/api/eval").then(r=>r.json()).then(e=>{const k={extraction_accuracy:"Extraction accuracy",policy_rule_accuracy:"Policy-rule accuracy",discrepancy_precision:"Discrepancy precision",discrepancy_recall:"Discrepancy recall",evidence_citation_accuracy:"Citation accuracy",unsupported_recommendation_rate:"Unsupported recs",recommendation_accuracy:"Recommendation acc.",auto_reject_count:"Auto-rejects"};
$("ev").innerHTML=Object.keys(e).length?Object.entries(k).map(([a,b])=>`<div class="m"><b>${a==="auto_reject_count"?e[a]:(e[a]*100).toFixed(1)+"%"}</b><span class="mu">${b}</span></div>`).join("")+`<div class="m"><b>${e.claims}</b><span class="mu">claims evaluated</span></div>`:'<span class="mu">Run python -m eval.run_eval</span>'});
$("go").onclick=async()=>{$("err").textContent="";$("go").disabled=true;try{const r=await fetch("/api/investigate?mode="+$("mode").value,{method:"POST",headers:{"Content-Type":"application/json"},body:$("claim").value});
if(!r.ok)throw new Error((await r.json()).detail||r.statusText);A=await r.json();sel=A.findings[0]?.code??null;render()}catch(e){$("err").textContent=e.message}$("go").disabled=false};
function render(){const nm=Object.fromEntries(A.nodes.map(n=>[n.id,n]));
const fs=A.findings.map(f=>`<div class="f ${f.code===sel?"sel":""}" onclick="sel='${f.code}';render()"><span class="badge ${f.kind}">${label(f.kind)}</span> <b>${esc(f.title)}</b><div class="mu">${esc(f.detail)}</div></div>`).join("")||'<div class="mu">No findings.</div>';
const f=A.findings.find(x=>x.code===sel);
const det=f?`<h3 style="margin:14px 0 4px">Evidence for ${esc(f.code)}</h3>`+f.evidence.map(id=>{const n=nm[id];return `<div class="ev"><code>${esc(id)}</code> · ${esc(n.type)}<br>${n.passage?"“"+esc(n.passage)+"”":esc(n.label)}${n.type==="fact"?`<br><span class="mu">${esc(n.label)}</span>`:""}</div>`}).join(""):"";
$("out").innerHTML=`<div><span class="badge rec ${A.recommendation}">${label(A.recommendation)}</span> <span class="mu">claim ${esc(A.claim_id)} · engine ${A.engine} · est. payable ${A.payable_estimate.toFixed(2)} (if approved) · auto-reject: ${A.auto_reject}</span></div>
<p>${esc(A.rationale)}</p>${fs}${det}<h3 style="margin:14px 0 4px">Evidence graph</h3>${graph(nm)}`}
function graph(nm){const ev=[...new Set(A.findings.flatMap(f=>f.evidence))],F=A.findings,H=Math.max(ev.length,F.length,1)*44+30,pos={};
ev.forEach((id,i)=>pos[id]=[10,24+i*44]);F.forEach((f,i)=>pos["finding:"+f.code]=[400,24+i*(H-30)/Math.max(F.length,1)]);pos.recommendation=[720,H/2-12];
let s=`<svg viewBox="0 0 900 ${H}">`;
for(const f of F)for(const id of f.evidence){const a=pos[id],b=pos["finding:"+f.code];s+=`<path class="e ${f.code===sel?"hi":""}" d="M${a[0]+250} ${a[1]+12}C330 ${a[1]+12} 330 ${b[1]+12} ${b[0]} ${b[1]+12}"/>`}
for(const f of F){const a=pos["finding:"+f.code],b=pos.recommendation;s+=`<path class="e ${f.code===sel?"hi":""}" d="M${a[0]+280} ${a[1]+12}C650 ${a[1]+12} 650 ${b[1]+12} ${b[0]} ${b[1]+12}"/>`}
const box=(p,c,t,w)=>`<rect x="${p[0]}" y="${p[1]}" width="${w}" height="24" rx="5" fill="#171e2e" stroke="${c}"/><text x="${p[0]+7}" y="${p[1]+16}">${esc(t.length>w/6?t.slice(0,w/6-1)+"…":t)}</text>`;
const col={fact:"#5b9dff",clause:"#f5a524",calculation:"#3ecf8e"};
for(const id of ev)s+=box(pos[id],col[nm[id].type]||"#888",nm[id].label,250);
for(const f of F)s+=box(pos["finding:"+f.code],f.code===sel?"#5b9dff":"#2a3550",f.code,280);
s+=box(pos.recommendation,"#3ecf8e",label(A.recommendation),170);return s+"</svg>"}
</script></body></html>
